# ─────────────────────────────────────────────────────────────
# CrimeNet AI — Reverse proxy
# Routes:  /        -> frontend (React dev/preview server)
#          /api/*   -> backend (FastAPI)
#          /ws/*    -> backend WebSocket
#          /docs    -> Swagger UI
# ─────────────────────────────────────────────────────────────
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 100m;

    # ── Compression ──────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/vnd.ms-fontobject;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    upstream frontend_upstream { server frontend:3000; }
    upstream backend_upstream  { server backend:8000; }

    server {
        listen 80;
        server_name _;

        # ── Frontend single-page app ─────────────────────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Backend REST API ─────────────────────────────────
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (real-time alerts) ─────────────────────
        location /ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ── Swagger UI / OpenAPI ─────────────────────────────
        location /docs {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }
    }
}
