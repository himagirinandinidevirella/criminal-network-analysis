version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# CrimeNet AI — AI-Powered Criminal Network Analysis System (SIH 2025)
# Full multi-service orchestration: frontend, backend, Neo4j, PostgreSQL, Redis
# ─────────────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=http://localhost:8000
      - VITE_APP_NAME=CrimeNet AI
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: crimenet2025
      POSTGRES_URL: postgresql://postgres:crimenet@postgres:5432/crimenetdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-crimenet-2025
      JWT_ALGORITHM: HS256
      ENVIRONMENT: production
      LOAD_SYNTHETIC_DATA: "true"
      ML_LOAD_MODELS: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost
      WEB3_PROVIDER_URI: http://ganache:8545
      BLOCKCHAIN_CHAIN_ID: "1337"
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080
    depends_on:
      - neo4j
      - postgres
      - redis
      - ganache
      - ipfs
    restart: unless-stopped

  neo4j:
    image: neo4j:5.9.0
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/crimenet2025
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/neo4j/bin/cypher-shell -u neo4j -p crimenet2025 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: crimenetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crimenet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crimenetdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ganache:
    image: trufflesuite/ganache:latest
    command:
      - --chain.chainId=1337
      - --server.host=0.0.0.0
      - --server.port=8545
      - --wallet.mnemonic=test test test test test test test test test test test junk
      - --wallet.totalAccounts=10
      - --wallet.defaultBalance=1000
      - --database.dbPath=/ganache
    ports:
      - "8545:8545"
    volumes:
      - ganache_data:/ganache
    restart: unless-stopped

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
      - "4001:4001"   # Swarm
    volumes:
      - ipfs_data:/data/ipfs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
  ganache_data:
  ipfs_data:
